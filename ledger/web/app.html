<title>Zeyn Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a conversation column on the left, the ledger's live state on the right; stacks to one column on phones. */
  :root {
    --bg: #f3f4f0; --panel: #ffffff; --ink: #1b1f1c; --muted: #5f675f; --line: #dfe3dc;
    --accent: #1d6b55; --accent-ink: #ffffff; --accent-soft: #dcebe4;
    --pos: #1c7347; --neg: #b0372c; --warn: #9a6200; --bubble: #eef0eb; --me: #1d6b55; --me-ink: #ffffff;
    --font-ui: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121513; --panel: #1a1e1b; --ink: #e8ece6; --muted: #98a196; --line: #2b302c;
      --accent: #58b796; --accent-ink: #0c1310; --accent-soft: #1f3a2f;
      --pos: #63c693; --neg: #ef8073; --warn: #e0ae4c; --bubble: #222723; --me: #2b6f5a; --me-ink: #f2f7f4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121513; --panel: #1a1e1b; --ink: #e8ece6; --muted: #98a196; --line: #2b302c;
    --accent: #58b796; --accent-ink: #0c1310; --accent-soft: #1f3a2f;
    --pos: #63c693; --neg: #ef8073; --warn: #e0ae4c; --bubble: #222723; --me: #2b6f5a; --me-ink: #f2f7f4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); padding-inline: 24px; padding-block: 0 24px; }
  @media (max-width: 900px) { body { padding-inline: 16px; } }
  .num, .kpis b, table, .row > span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13.5px; }
  header { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 18px 12px; }
  header h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
  header h1 span { color: var(--accent); }
  .kpis { display: flex; gap: 8px 22px; flex-wrap: wrap; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .kpis b { display: block; color: var(--ink); font-size: 16px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .status[data-s="ok"] i { background: var(--pos); }
  .status[data-s="busy"] i { background: var(--warn); }
  .status[data-s="err"] i { background: var(--neg); }
  .status[data-s="warn"] i { background: var(--warn); }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
  main > *, .side > * { min-width: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .status { margin-left: 0; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
  #chat { display: flex; flex-direction: column; height: calc(100dvh - 96px); min-height: 460px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 0; }
  @media (max-width: 900px) { #chat { position: static; height: 72dvh; } }
  #log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .msg code { font: 11.5px var(--font-num); color: var(--muted); }
  .msg em { color: var(--muted); font-style: normal; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 11px; font: 500 13px var(--font-ui); cursor: pointer; }
  .chip:hover, .chip:focus-visible { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; background: var(--bg); color: var(--ink); min-height: 42px; max-height: 140px; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 0 18px; font: 700 14px var(--font-ui); cursor: pointer; }
  button.send:disabled, button.ghost:disabled { opacity: 0.5; cursor: progress; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font: 600 13px var(--font-ui); cursor: pointer; }
  button.ghost:hover { border-color: var(--accent); }
  #chat { position: relative; }
  .confirm { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; white-space: normal; }
  .confirm ul { margin: 0; padding-left: 18px; }
  .confirm li { font-weight: 600; }
  .confirm .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .confirm button { border-radius: 7px; padding: 5px 12px; font: 600 13px var(--font-ui); cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .confirm button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .confirm .state { color: var(--muted); font-size: 13px; }
  .msg .lookup { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .stop { margin-left: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 1px 8px; font: 12px var(--font-ui); cursor: pointer; }
  .mode { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 11px; font: 600 12px var(--font-ui); cursor: pointer; }
  .mode[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  [hidden] { display: none !important; }
  .drop { position: absolute; inset: 0; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink); border: 2px dashed var(--accent); border-radius: 10px; font-weight: 600; z-index: 2; padding: 16px; text-align: center; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .side .wide { grid-column: 1 / -1; }
  @media (max-width: 640px) { .side { grid-template-columns: 1fr; } }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.tight { border: 0; padding: 0; font-size: 13.5px; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); } .warn { color: var(--warn); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.over > i { background: var(--neg); }
  .bar.pace > i { background: var(--warn); }
  .small { font-size: 13px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font: 700 11px var(--font-ui); text-transform: uppercase; letter-spacing: 0.06em; }
  svg text { fill: var(--muted); font: 11px var(--font-num); }
  .empty { color: var(--muted); font-size: 13.5px; }
  .empty b { color: var(--ink); font-weight: 600; }
  .insight { padding: 4px 0 4px 14px; font-size: 14px; position: relative; }
  .insight::before { content: ""; position: absolute; left: 0; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .insight[data-l="good"]::before { background: var(--pos); }
  .insight[data-l="warn"]::before { background: var(--warn); }
  .insight[data-l="bad"]::before { background: var(--neg); }
  pre.activity { margin: 0; font: 12px/1.7 var(--font-num); white-space: pre-wrap; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .msg { animation: in 0.18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: 0.4; } } }
</style>

<header>
  <h1>Zeyn <span>Ledger</span></h1>
  <div class="kpis" id="kpis"></div>
  <div class="status" id="status" data-s="busy"><i></i><span id="statusText">Opening your ledger…</span></div>
</header>
<main>
  <section class="card" id="chat" aria-label="Conversation">
    <div id="log" role="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="chips"><button class="mode" id="mode" type="button" aria-pressed="false" hidden>Claude: off</button><span class="muted small" id="modeNote"></span></div>
    <div class="drop" id="drop" hidden>Drop a statement (.md or bank .csv) to import it</div>
    <form id="form">
      <input type="file" id="file" accept=".md,.csv,.txt,.markdown" multiple hidden>
      <button class="ghost" id="importBtn" type="button" title="Import a bank statement (.md import file or bank .csv)" disabled>Import</button>
      <textarea id="input" rows="1" placeholder="I paid 120 for dinner with Ali and Sara" autocomplete="off" aria-label="Tell the ledger what happened"></textarea>
      <button class="send" id="send" type="submit" disabled>Send</button>
    </form>
  </section>
  <section class="side">
    <div class="card"><h2>Accounts</h2><div id="accounts"></div></div>
    <div class="card"><h2>Coming up</h2><div id="upcoming"></div></div>
    <div class="card"><h2>Balances with people</h2><div id="balances"></div></div>
    <div class="card"><h2 id="monthTitle">This month</h2><div id="month"></div></div>
    <div class="card wide"><h2>Forecast</h2><div id="forecast"></div></div>
    <div class="card"><h2>Goals</h2><div id="goals"></div></div>
    <div class="card"><h2>Budgets</h2><div id="budgets"></div></div>
    <div class="card wide"><h2>Insights</h2><div id="insights"></div></div>
    <div class="card"><h2>Groups</h2><div id="groups"></div></div>
    <div class="card"><h2>Recurring</h2><div id="recurring"></div></div>
    <div class="card wide"><h2>Recent activity</h2><pre class="activity" id="activity"></pre></div>
    <div class="card wide"><h2>What it has learned</h2><div id="brain" class="small"></div></div>
  </section>
</main>

<script>
/*__ENGINE__*/

// ── persistence ──────────────────────────────────────────────────────────
// The ledger is kept in the viewer's private db subtree: one `core` document
// plus one document per month of entries, so no single document approaches
// the store's size cap. Only documents whose content changed are rewritten.
class PageStore {
  constructor(state) { this.state = state; this.undo = []; this.onSave = null; }
  load() { return JSON.parse(JSON.stringify(this.state)); }
  save(state) { this.state = state; if (this.onSave) this.onSave(state); }
  loadUndo() { return this.undo; }
  saveUndo(s) { this.undo = s; }
}
function toDocs(state) {
  const { expenses, transfers, income, ...core } = state;
  const docs = { core };
  for (const [kind, list] of [['expenses', expenses], ['transfers', transfers], ['income', income]])
    for (const x of list) {
      const id = 'm-' + x.date.slice(0, 7);
      (docs[id] ??= { expenses: [], transfers: [], income: [] })[kind].push(x);
    }
  return docs;
}
function fromDocs(docs) {
  if (!docs.core) return null;
  const s = { ...docs.core, expenses: [], transfers: [], income: [] };
  for (const id of Object.keys(docs).filter((k) => k.startsWith('m-')).sort())
    for (const kind of ['expenses', 'transfers', 'income']) s[kind].push(...(docs[id][kind] || []));
  return State.migrate(s);
}

const LOCAL_KEY = 'zeyn-ledger-v1';
let saver = null;
function makeDbSaver(col, initialDocs) {
  let saved = Object.fromEntries(Object.entries(initialDocs).map(([k, v]) => [k, JSON.stringify(v)]));
  let running = false, again = false, latest = null;
  return async function persist(state) {
    latest = state;
    if (running) { again = true; return; }
    running = true;
    setStatus('busy', 'Saving…');
    try {
      do {
        again = false;
        const docs = toDocs(latest);
        for (const [id, body] of Object.entries(docs)) {
          const json = JSON.stringify(body);
          if (saved[id] === json) continue;
          await col.doc(id).set(JSON.parse(json));
          saved[id] = json;
        }
        for (const id of Object.keys(saved)) if (!(id in docs)) { await col.doc(id).delete(); delete saved[id]; }
      } while (again);
      setStatus('ok', 'Saved to your account');
    } catch (e) {
      setStatus('err', e?.code === 'quota_exceeded' ? 'Storage is full — delete old entries' : 'Not saved — ' + (e?.message || 'try again'));
    } finally { running = false; }
  };
}
function localSaver(state) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); setStatus('warn', 'Saved in this browser only'); }
  catch { setStatus('err', 'Not saved — storage unavailable here'); }
}

// ── app ──────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
let assistant = new Engine.Assistant(new PageStore(State.emptyState()));
let ready = false;

function setStatus(s, text) { $('status').dataset.s = s; $('statusText').textContent = text; }
const money = (c) => new Intl.NumberFormat('en-US', { style: 'currency', currency: assistant.s.currency }).format((c || 0) / 100);
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const md = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/(^|\s)_(.+?)_(?=\s|$)/gm, '$1<em>$2</em>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');

const CHIPS = ["what's left this month", "what's left next month", 'how am I doing', 'forecast 12 months', 'balances', 'budgets', 'what have you learned', 'undo', 'help'];
$('chips').innerHTML = CHIPS.map((c) => `<button class="chip" type="button">${esc(c)}</button>`).join('');
$('chips').addEventListener('click', (e) => { if (e.target.matches('.chip') && ready) send(e.target.textContent, { local: true }); });

// ── Claude-first chat ──────────────────────────────────────────────────────
// With Claude on, every message goes to Claude with the ledger's numbers;
// records come back as a proposal to confirm. App commands (undo, help,
// history, delete, statements, the quick buttons) stay local and instant.
let copilot = null, claudeOn = false, currentCard = null, ctl = null, samplerRef = null;
// (An undo or delete while a proposal is open leaves the proposal as it is.)
const LOCAL_RE = /^(?:undo|help|history|activity|what have you learned|forget lesson \d+|delete\b|remove\b|recurring|bills)\b/i;
function setClaude(on, note = '') {
  claudeOn = Boolean(on && copilot);
  AI.setSampler(claudeOn ? samplerRef : null); // off means no Claude usage at all
  $('mode').hidden = !copilot;
  $('mode').setAttribute('aria-pressed', String(claudeOn));
  $('mode').textContent = claudeOn ? 'Claude: on' : 'Claude: off';
  $('modeNote').textContent = note || (claudeOn ? 'Messages go to Claude; you confirm before anything is saved.' : copilot ? 'Offline: the built-in reader handles messages.' : '');
  try { localStorage.setItem('zeyn-claude', claudeOn ? 'on' : 'off'); } catch {}
}
$('mode').addEventListener('click', () => setClaude(!claudeOn));

function confirmCard(bubbleEl, actions) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML = `<div class="state">Is this right?</div><ul>${actions.map((a) => `<li>${esc(a.summary)}</li>`).join('')}</ul><div class="btns"><button class="primary" type="button" data-a="ok">Confirm</button><button type="button" data-a="fix">Change</button><button type="button" data-a="no">Cancel</button></div>`;
  bubbleEl.appendChild(box);
  currentCard = box;
  box.addEventListener('click', (e) => {
    const act = e.target.dataset?.a;
    if (!act || box !== currentCard) return;
    if (act === 'ok') {
      try {
        const replies = copilot.confirm();
        box.innerHTML = `<div class="state">✓ Saved</div><div>${md((replies || []).join('\n'))}</div>`;
      } catch (err) {
        box.innerHTML = `<div class="state">⚠️ ${esc(err.message)}</div>`;
      }
      currentCard = null;
      render();
    } else if (act === 'no') {
      copilot.cancel();
      box.innerHTML = '<div class="state">Cancelled — nothing saved.</div>';
      currentCard = null;
    } else {
      box.querySelector('.state').textContent = 'Tell me what to change below.';
      $('input').placeholder = 'What should change? e.g. “it was 40, and Ali paid”';
      $('input').focus();
    }
    $('log').scrollTop = $('log').scrollHeight;
  });
  return box;
}

async function askClaude(text, pending) {
  ctl = new AbortController();
  pending.innerHTML = 'Claude is reading… <button class="stop" type="button">Stop</button>';
  pending.querySelector('.stop').onclick = () => ctl.abort();
  if (currentCard) { currentCard.querySelector('.btns')?.remove(); currentCard = null; }
  try {
    const r = await copilot.ask(text, { signal: ctl.signal });
    pending.innerHTML = md(r.reply + (r.question && !r.reply.includes(r.question) ? `\n${r.question}` : ''));
    for (const q of r.queries) { const d = document.createElement('span'); d.className = 'lookup'; d.textContent = q; pending.appendChild(d); }
    if (r.actions.length) confirmCard(pending, r.actions);
    $('input').placeholder = 'I paid 120 for dinner with Ali and Sara';
  } catch (e) {
    const code = e?.code;
    if (code === 'cancelled') pending.innerHTML = md('_Stopped._');
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
      copilot = null;
      setClaude(false, 'Claude isn’t available here, so the built-in reader is answering.');
      const r = await assistant.handle(text);
      pending.innerHTML = md(r.reply);
    } else if (code === 'rate_limited') pending.innerHTML = md('Claude is busy or you’ve hit your usage limit. Try again in a moment, or switch Claude off to use the built-in reader.');
    else pending.innerHTML = md(`Claude couldn’t answer just now${e?.message ? ` (${e.message})` : ''}. Send it again, or switch Claude off to use the built-in reader.`);
  }
}

function bubble(text, who) {
  const d = document.createElement('div');
  d.className = `msg ${who}`;
  d.innerHTML = who === 'bot' ? md(text) : esc(text);
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

let busy = false;
async function send(text, { local = false } = {}) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  $('send').disabled = true;
  const lines = text.split('\n').length;
  bubble(lines > 4 ? `Pasted statement (${lines} lines)` : text, 'me');
  const pending = bubble('…', 'bot');
  try {
    const viaClaude = claudeOn && copilot && !local && !LOCAL_RE.test(text) && lines <= 4;
    if (viaClaude) await askClaude(text, pending);
    else {
      const r = await assistant.handle(text);
      pending.innerHTML = md(r.reply);
    }
  } catch (err) {
    pending.innerHTML = md(`⚠️ ${err.message}`);
  }
  render();
  busy = false;
  $('send').disabled = false;
  $('log').scrollTop = $('log').scrollHeight;
  $('input').focus();
}
$('form').addEventListener('submit', (e) => { e.preventDefault(); if (!ready) return; const t = $('input').value; $('input').value = ''; send(t); });
// Statements: the Import button, drag-and-drop onto the chat, or pasting the
// file's text straight into the message box all go through the same importer.
async function importFiles(files) {
  if (!ready || busy || !files.length) return;
  busy = true;
  $('send').disabled = $('importBtn').disabled = true;
  for (const f of files) {
    bubble(`Import ${f.name}`, 'me');
    const pending = bubble('Reading the statement…', 'bot');
    try {
      const text = await f.text();
      const r = assistant.importStatement(text, f.name);
      pending.innerHTML = md(r.reply);
    } catch (err) {
      pending.innerHTML = md(`⚠️ ${err.message}`);
    }
  }
  render();
  busy = false;
  $('send').disabled = $('importBtn').disabled = false;
}
$('importBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => { importFiles([...e.target.files]); e.target.value = ''; });
let dragDepth = 0;
$('chat').addEventListener('dragenter', (e) => { if (e.dataTransfer?.types?.includes('Files')) { e.preventDefault(); dragDepth++; $('drop').hidden = false; } });
$('chat').addEventListener('dragover', (e) => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
$('chat').addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
$('chat').addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; importFiles([...(e.dataTransfer?.files || [])]); });

$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });

function render() {
  const d = assistant.dashboard();
  const owed = d.balances.filter((b) => b.amount > 0).reduce((a, b) => a + b.amount, 0);
  const owe = d.balances.filter((b) => b.amount < 0).reduce((a, b) => a - b.amount, 0);
  $('kpis').innerHTML = [
    ['Owed to you', money(owed), owed ? 'pos' : ''], ['You owe', money(owe), owe ? 'neg' : ''],
    [`Spent · ${d.month.label}`, money(d.month.spent), ''], ['Earned', money(d.month.income), ''],
    ...(d.cash != null ? [['Cash (est.)', money(d.cash), d.cash < 0 ? 'neg' : '']] : []),
  ].map(([k, v, c]) => `<div>${esc(k)}<b class="${c}">${v}</b></div>`).join('');

  $('accounts').innerHTML = d.accounts.length
    ? d.accounts.map((a) => `<div class="row small"><span>${esc(a.name)}<br><span class="muted">${esc(a.type)}${a.spendable ? ' · spendable' : ''} · ${esc(a.asOf)}</span></span><span class="${/credit/.test(a.type) ? 'neg' : ''}">${/credit/.test(a.type) ? 'owe ' : ''}${money(Math.abs(a.balance))}</span></div>`).join('') +
      (d.cash != null ? `<div class="row small"><span><b>Free cash today</b>${d.cashInfo?.owedOnCards ? '<br><span class="muted">after card balances owed</span>' : ''}</span><span><b>${money(d.cash)}</b></span></div>` : '')
    : '<div class="empty">Import your foundation file to see every account here.</div>';
  $('upcoming').innerHTML = d.upcoming.length
    ? d.upcoming.map((r) => `<div class="row small"><span>${r.kind === 'income' ? 'In · ' : 'Out · '}${esc(r.label)}<br><span class="muted">${esc(r.next)}</span></span><span class="${r.kind === 'income' ? 'pos' : 'neg'}">${r.kind === 'income' ? '+' : '−'}${money(r.payload.amount)}</span></div>`).join('')
    : '<div class="empty">Expected aid, refunds and planned purchases show here. Try <b>expect 1849 Pell Grant on Jan 12</b>.</div>';
  const bals = d.balances.filter((b) => b.amount);
  $('balances').innerHTML = bals.length
    ? bals.map((b) => `<div class="row"><span>${esc(b.name)}</span><span class="${b.amount > 0 ? 'pos' : 'neg'}">${b.amount > 0 ? 'owes you ' : 'you owe '}${money(Math.abs(b.amount))}</span></div>`).join('')
    : '<div class="empty">Nobody owes anything yet. Try <b>I paid 120 for dinner with Ali and Sara</b>.</div>';

  $('monthTitle').textContent = d.month.label;
  const cats = Object.entries(d.month.byCategory).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...cats.map(([, v]) => v));
  $('month').innerHTML = cats.length
    ? cats.map(([c, v]) => `<div class="row tight"><span>${esc(c)}</span><span>${money(v)}</span></div><div class="bar"><i style="width:${(100 * v) / max}%"></i></div>`).join('')
    : '<div class="empty">Your share of each expense shows here by category. Try <b>Uber 23</b>.</div>';

  $('budgets').innerHTML = d.budgets.length
    ? d.budgets.map((b) => `<div class="row tight"><span>${esc(b.category)}</span><span>${money(b.used)} / ${money(b.budget)}</span></div><div class="bar ${b.used > b.budget ? 'over' : !b.onPace ? 'pace' : ''}"><i style="width:${Math.min(100, b.pct)}%"></i></div>`).join('')
    : '<div class="empty">Try <b>budget 400 for food</b>.</div>';

  $('goals').innerHTML = d.goals.length
    ? d.goals.map((g) => `<div class="row tight"><span>${esc(g.name)}</span><span>${money(g.saved)} / ${money(g.target)}</span></div><div class="bar"><i style="width:${g.pct}%"></i></div>${g.deadline ? `<div class="muted small" style="margin:-6px 0 10px">by ${g.deadline} · ${money(g.perMonth)}/mo</div>` : ''}`).join('')
    : '<div class="empty">Try <b>save 10000 for a car by June 2027</b>.</div>';

  renderForecast(d.forecast);

  $('insights').innerHTML = d.insights.length
    ? d.insights.map((x) => `<div class="insight" data-l="${x.level}">${esc(x.text)}</div>`).join('')
    : '<div class="empty">Insights appear as your history builds up.</div>';

  $('groups').innerHTML = d.groups.length
    ? d.groups.map((g) => `<div style="margin-bottom:10px"><b>${esc(g.name)}</b> <span class="muted small">${g.memberNames.map(esc).join(', ')}</span>${g.plan.length ? g.plan.map((p) => `<div class="row small"><span>${esc(p.fromName)} → ${esc(p.toName)}</span><span>${money(p.amount)}</span></div>`).join('') : '<div class="muted small">settled</div>'}</div>`).join('')
    : '<div class="empty">Try <b>create group Trip with Ali and Sara</b>.</div>';

  $('recurring').innerHTML = d.recurring.length
    ? d.recurring.map((r) => `<div class="row small"><span>${r.kind === 'income' ? 'Income · ' : ''}${esc(r.label)}</span><span>${money(r.payload.amount)}/${r.freq === 'biweek' ? '2wk' : r.freq.slice(0, 2)} · ${r.next.slice(5)}</span></div>`).join('')
    : '<div class="empty">Try <b>netflix 15 monthly</b> or <b>salary 5200 every month on the 1st</b>.</div>';

  $('activity').textContent = d.activity.replace(/`/g, '');
  const st = d.brain.stats;
  const understood = st.ruleHits + st.templateHits + st.aiHits;
  $('brain').innerHTML = `Understood <b>${understood}</b> of ${understood + st.misses} statements · <b>${d.brain.templates}</b> phrasings learned · <b>${d.brain.words}</b> category words · forecast correction ×${d.brain.factor.toFixed(2)} · Claude fallback ${d.brain.ai ? '<span class="pos">on</span>' : 'off'}`;
}

function renderForecast(f) {
  const rows = f.rows;
  const hasCash = f.cashNow != null;
  const series = rows.map((r) => (hasCash ? r.cashEnd : r.cumulative));
  const W = 640, H = 160, padX = 34;
  const lo = Math.min(0, ...series), hi = Math.max(1, ...series);
  const x = (i) => padX + (i * (W - 2 * padX)) / Math.max(1, rows.length - 1);
  const y = (v) => H - 24 - ((v - lo) * (H - 44)) / (hi - lo || 1);
  const pts = series.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const area = `${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(rows.length - 1)},${y(Math.max(lo, 0))}`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${hasCash ? 'Projected cash' : 'Cumulative surplus'} by month">
    <line x1="${padX}" x2="${W - padX}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" />
    <polygon points="${area}" fill="var(--accent-soft)" opacity="0.7" />
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" />
    ${series.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === series.length - 1 ? 4.5 : 3}" fill="${v < 0 ? 'var(--neg)' : 'var(--accent)'}"><title>${rows[i].label}: ${money(v)}</title></circle><text x="${x(i)}" y="${H - 6}" text-anchor="middle">${rows[i].label.slice(0, 3)}</text>`).join('')}
  </svg>`;
  const table = `<div class="scroll"><table><tr><th>Month</th><th>In</th><th>Out</th><th>Net</th><th>Goals</th><th>${hasCash ? 'Cash' : 'Cumulative'}</th></tr>${rows.map((r, i) => `<tr><td>${r.label}</td><td>${money(r.income)}</td><td>${money(r.fixed + r.variable)}</td><td class="${r.net < 0 ? 'neg' : 'pos'}">${money(r.net)}</td><td>${money(r.goals)}</td><td class="${series[i] < 0 ? 'neg' : ''}">${money(series[i])}</td></tr>`).join('')}</table></div>`;
  const note = hasCash ? '' : ' · tell me your balance (“I have 8000 in the bank”) to project real cash';
  $('forecast').innerHTML = `<div class="muted small">Everyday spend ${money(f.variablePerMonth)}/mo from ${esc(f.basis)}${Math.abs(f.factor - 1) > 0.01 ? ` · self-corrected ×${f.factor.toFixed(2)}` : ''}${note}</div>${svg}${table}`;
}

async function boot() {
  render();
  const use = (name) => (window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
  const [db, user, sample] = await Promise.all([use('db'), use('user'), use('sample')]);
  samplerRef = sample;
  if (sample) AI.setSampler(sample);
  let state = null;
  try {
    const uid = db && user ? await user.id() : null;
    if (db && uid) {
      const col = db.collection('data/users/' + uid);
      const snap = await col.get();
      const docs = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
      state = fromDocs(docs) ?? State.emptyState();
      saver = makeDbSaver(col, docs);
      setStatus('ok', 'Saved to your account');
    }
  } catch (e) {
    setStatus('err', 'Couldn’t reach your saved ledger — changes stay in this tab');
  }
  if (!state) {
    try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) state = State.migrate(JSON.parse(raw)); } catch {}
    state ??= State.emptyState();
    if ($('status').dataset.s !== 'err') { saver = localSaver; setStatus('warn', 'Saved in this browser only'); }
  }
  const store = new PageStore(state);
  store.onSave = (s) => saver && saver(s);
  assistant = new Engine.Assistant(store);
  if (sample) {
    copilot = new CopilotMod.Copilot(assistant, sample);
    let pref = 'on';
    try { pref = localStorage.getItem('zeyn-claude') || 'on'; } catch {}
    setClaude(pref !== 'off');
  }
  if (assistant.ledger.materializeRecurring().length) assistant.ledger.persist(); // bills that came due while away
  ready = true;
  $('send').disabled = $('importBtn').disabled = false;
  render();
  const first = !assistant.s.expenses.length && !assistant.s.transfers.length && !assistant.s.income.length;
  bubble(first
    ? (claudeOn ? 'Claude reads every message here and shows you exactly what it understood before anything is saved. ' : '') + 'Tell me what happened in plain words — **I paid 120 for dinner with Ali and Sara**, **Ali paid me back 20**, **salary 5200 every month on the 1st**, **can I afford a 1500 laptop in March?** To load your history, press **Import** and choose a statement (a Ledger import .md or your bank’s .csv). Type **help** for everything I understand.'
    : (assistant.s.openQuestions?.length ? `Before we start, a few things your files didn’t settle — answer any of them here:\n${assistant.s.openQuestions.map((q) => `– ${q}`).join('\n')}\n\n` : '') + 'Welcome back. Ask **what’s left this month**, **can I afford…**, or just tell me what happened' + (claudeOn ? ' — Claude will confirm the details with you before saving.' : '.'), 'bot');
}
boot();
</script>
